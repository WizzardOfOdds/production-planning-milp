[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prodplan"
version = "0.1.0"
description = "Mixed-integer production planning for a multi-period business game"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pulp>=3.0", "highspy>=1.7"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
