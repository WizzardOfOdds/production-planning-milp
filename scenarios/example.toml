# ---------------------------------------------------------------- markets
# 0 demand = market not open yet

[markets.car]
demand = [0, 180, 210, 240, 270, 300, 320, 340, 360, 390, 420, 430, 420, 400, 380, 350]
price  = [0, 21_000, 21_000, 21_500, 21_500, 22_000, 22_000, 22_500, 22_500, 23_000, 23_000, 22_500, 22_500, 22_000, 21_500, 21_000]

[markets.e_axle]
demand = [0, 0, 0, 0, 40, 50, 50, 60, 60, 60, 70, 70, 60, 60, 50, 50]
price  = [0, 0, 0, 0, 2_300, 2_350, 2_400, 2_400, 2_450, 2_450, 2_500, 2_500, 2_450, 2_400, 2_400, 2_350]

[markets.reman_axle]
demand = [0, 0, 0, 0, 30, 40, 40, 50, 50, 60, 60, 60, 60, 50, 50, 40]
price  = [0, 0, 0, 0, 1_400, 1_450, 1_500, 1_500, 1_550, 1_550, 1_600, 1_600, 1_550, 1_500, 1_500, 1_450]

# ---------------------------------------------------------------- financing

[[loans]]
name = "short"
max_amount = 500_000
rate = 0.06
disagio = 0.02
[[loans]]
name = "long"
max_amount = 1_000_000
rate = 0.04
disagio = 0.05
